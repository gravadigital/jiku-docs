asyncapi: 3.0.0
info:
  title: jiku-docs — events and notifications
  version: 1.3.0
  description: |
    Two channels come out of the jiku-docs changelog (outbox, same transaction as the command):

    1. JetStream stream `JIKU_DOCS_EVENTS` — subjects `{instance}.docs-events.v1.>`.
       For services only. Limits retention, max_age 30 days. At-least-once delivery:
       deduplicate by `eventId`. Published with `Nats-Msg-Id = eventId`.
    2. Per-person notifications — `{instance}.{userId}.docs-notify.v1.{entity}.{action}`.
       NATS core, no persistence. To every person with `read` on the document, connected or not.
       They do not include `snapshot.relations` or `changes.relations`. Gaps are covered with
       the `documents.changes` query.

    Guarantees: an event always describes something already committed in the database; no committed
    change is left without an event (unlike core's JIKU_EVENTS, which is best-effort).
    Events never carry document content or presigned URLs.
    A new field within v1 is not a breaking change: consumers must tolerate it.

    Implementation notes (1.1.0):
    - `folder.updated` (renaming, moving or changing flags changes paths and visibility) is also
      notified as `access.changed` to internal persons, like `folder.acl.changed`.
    - `document.unlocked` carries `changes.reason`: `released` (unlock by the session), `forced`
      (unlock with force) or `expired` (expiry; the actor is the jiku-docs service).
    - `document.moved` carries `changes.path` and, if it changed folder, `changes.folderId`.
    - The `docs-events` and `docs-notify` subjects are fixed: they do NOT derive from the `serviceName` of
      the module registry (which only names the micro services `{serviceName}-commands` / `-queries`). The
      stream is always called `JIKU_DOCS_EVENTS`.
    - `actor.via` is always `service` when the actor is a service.

    P-1 (1.3.0, docs/p1/service.md; new fields, no breaking changes):
    - `snapshot.visibility` accepts `restricted`; `snapshot.lock.holderName` is the name of whoever
      holds the lock (or `null`).
    - Notifications of a `restricted` document reach admins only.
    - When a document becomes `restricted`, each internal person who read it and no longer does (the `user`s)
      receives `access.changed`, without detail; when it goes from `public` to another visibility, the same
      for the external persons with permission on any of its projects. It is the signal for the sync daemon
      to reconcile right away.
    - `share.revoked` may carry `changes.reason: restricted` (the document became restricted).
    - The P-1 data migration writes `document.updated` with `actor` the jiku-docs service and
      `changes.message` "P-1 migration: …".
defaultContentType: application/json

servers:
  jiku-nats:
    host: '{natsHost}'
    protocol: nats
    variables:
      natsHost:
        default: nats.jiku.local:4222

channels:
  docsEvents:
    address: '{instance}.docs-events.v1.{entity}.{action}'
    description: Stream JIKU_DOCS_EVENTS. The subject ends in the event `type`.
    parameters:
      instance: { $ref: '#/components/parameters/instance' }
      entity: { enum: [document, folder, attachment, share] }
      action: { description: 'created, updated, moved, deleted, restored, locked, unlocked, acl.changed, revoked' }
    messages:
      documentCreated:   { $ref: '#/components/messages/DocumentEvent' }
      documentUpdated:   { $ref: '#/components/messages/DocumentEvent' }
      documentMoved:     { $ref: '#/components/messages/DocumentEvent' }
      documentDeleted:   { $ref: '#/components/messages/DocumentEvent' }
      documentRestored:  { $ref: '#/components/messages/DocumentEvent' }
      documentLocked:    { $ref: '#/components/messages/DocumentEvent' }
      documentUnlocked:  { $ref: '#/components/messages/DocumentEvent' }
      folderCreated:     { $ref: '#/components/messages/FolderEvent' }
      folderUpdated:     { $ref: '#/components/messages/FolderEvent' }
      folderDeleted:     { $ref: '#/components/messages/FolderEvent' }
      folderAclChanged:  { $ref: '#/components/messages/FolderEvent' }
      attachmentCreated: { $ref: '#/components/messages/AttachmentEvent' }
      attachmentDeleted: { $ref: '#/components/messages/AttachmentEvent' }
      shareCreated:      { $ref: '#/components/messages/ShareEvent' }
      shareRevoked:      { $ref: '#/components/messages/ShareEvent' }
  docsNotify:
    address: '{instance}.{userId}.docs-notify.v1.{entity}.{action}'
    description: Permission-filtered notification for a connected person.
    parameters:
      instance: { $ref: '#/components/parameters/instance' }
      userId: { description: 'Zitadel `sub` of the recipient person.' }
      entity: { enum: [document, attachment, access] }
      action: { description: 'created, updated, moved, deleted, restored, locked, unlocked, changed' }
    messages:
      documentNotification: { $ref: '#/components/messages/DocumentNotification' }
      attachmentNotification: { $ref: '#/components/messages/AttachmentEvent' }
      accessChanged: { $ref: '#/components/messages/AccessChanged' }

operations:
  publishDocsEvents:
    action: send
    channel: { $ref: '#/channels/docsEvents' }
    description: Published by the jiku-docs outbox publisher.
  consumeDocsEvents:
    action: receive
    channel: { $ref: '#/channels/docsEvents' }
    description: |
      Consumer services (indexer, Jiku, connectors). Own durable with a unique name,
      explicit ack, filter_subject with version, persisted deduplication by eventId,
      ignore own events (actor.id).
  publishDocsNotify:
    action: send
    channel: { $ref: '#/channels/docsNotify' }
  receiveDocsNotify:
    action: receive
    channel: { $ref: '#/channels/docsNotify' }
    description: Sync daemon and frontends, subscribed to their own userId.

components:
  parameters:
    instance: { enum: [dev, prod] }

  messages:
    DocumentEvent:
      payload: { $ref: '#/components/schemas/DocumentEventEnvelope' }
    FolderEvent:
      payload: { $ref: '#/components/schemas/FolderEventEnvelope' }
    AttachmentEvent:
      payload: { $ref: '#/components/schemas/AttachmentEventEnvelope' }
    ShareEvent:
      description: Stream only; never notified to persons. Never carries the token.
      payload: { $ref: '#/components/schemas/ShareEventEnvelope' }
    DocumentNotification:
      payload: { $ref: '#/components/schemas/DocumentNotificationEnvelope' }
    AccessChanged:
      payload: { $ref: '#/components/schemas/AccessChangedEnvelope' }

  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    Actor:
      type: object
      additionalProperties: false
      required: [id, via]
      properties:
        id: { type: string, description: 'Zitadel `sub`.' }
        name: { type: [string, 'null'] }
        via: { type: string, enum: [human, agent, service] }
    Relations:
      type: object
      additionalProperties: false
      properties:
        clients: { type: array, items: { type: integer } }
        projects: { type: array, items: { type: integer } }
        requirements: { type: array, items: { type: integer } }
        tasks: { type: array, items: { type: integer } }
    BaseEnvelope:
      type: object
      required: [eventId, seq, type, version, occurredAt, correlationId, actor, entity]
      properties:
        eventId: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer, description: Position in the changelog. Monotonic. }
        type: { type: string, description: Equal to the tail of the subject (e.g. document.updated). }
        version: { const: v1 }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        actor: { $ref: '#/components/schemas/Actor' }

    DocumentSnapshot:
      type: object
      additionalProperties: false
      required: [title, version, checksum, visibility, folderId, path]
      properties:
        title: { type: string }
        version: { type: integer }
        checksum: { type: string }
        sizeBytes: { type: integer }
        visibility: { type: string, enum: [internal, public, restricted] }
        folderId: { $ref: '#/components/schemas/Ulid' }
        path: { type: string }
        relations: { $ref: '#/components/schemas/Relations' }
        topics: { type: array, items: { type: string } }
        deleted: { type: boolean }
        lock:
          type: [object, 'null']
          properties:
            sessionId: { $ref: '#/components/schemas/Ulid' }
            holder: { type: string }
            holderName: { type: [string, 'null'] }
            via: { type: string, enum: [human, agent] }
            expiresAt: { type: string, format: date-time }
    DocumentEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [entity, snapshot]
          properties:
            type: { enum: [document.created, document.updated, document.moved, document.deleted, document.restored, document.locked, document.unlocked] }
            entity:
              type: object
              additionalProperties: false
              required: [type, id, folderId, path]
              properties:
                type: { const: document }
                id: { $ref: '#/components/schemas/Ulid' }
                folderId: { $ref: '#/components/schemas/Ulid' }
                path: { type: string }
            snapshot: { $ref: '#/components/schemas/DocumentSnapshot' }
            changes:
              type: object
              description: What changed. The keys present depend on the event type.
              properties:
                version: { type: object, properties: { from: { type: integer }, to: { type: integer } } }
                path: { type: object, properties: { from: { type: string }, to: { type: string } } }
                title: { type: object, properties: { from: { type: string }, to: { type: string } } }
                visibility: { type: object, properties: { from: { type: string }, to: { type: string } } }
                relations:
                  type: object
                  properties:
                    added: { $ref: '#/components/schemas/Relations' }
                    removed: { $ref: '#/components/schemas/Relations' }
                topics:
                  type: object
                  properties:
                    added: { type: array, items: { type: string } }
                    removed: { type: array, items: { type: string } }
                restoredFrom: { type: integer }
                message: { type: [string, 'null'] }
                folderId: { type: object, properties: { from: { type: string }, to: { type: string } } }
                reason: { type: string, enum: [released, forced, expired], description: Only in document.unlocked. }
                lock: { type: object, description: 'In document.unlocked: the lock that ended ({ from: lock, to: null }).' }

    FolderEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [entity, snapshot]
          properties:
            type: { enum: [folder.created, folder.updated, folder.deleted, folder.acl.changed] }
            entity:
              type: object
              additionalProperties: false
              required: [type, id, path]
              properties:
                type: { const: folder }
                id: { $ref: '#/components/schemas/Ulid' }
                path: { type: string }
            snapshot:
              type: object
              properties:
                name: { type: string }
                parentId: { type: [string, 'null'] }
                path: { type: string }
                inheritAcl: { type: boolean }
                externalBlocked: { type: boolean }
                sharingBlocked: { type: boolean }
            changes: { type: object }

    AttachmentEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [entity]
          properties:
            type: { enum: [attachment.created, attachment.deleted] }
            entity:
              type: object
              additionalProperties: false
              required: [type, id, documentId]
              properties:
                type: { const: attachment }
                id: { $ref: '#/components/schemas/Ulid' }
                documentId: { $ref: '#/components/schemas/Ulid' }
                folderId: { $ref: '#/components/schemas/Ulid' }
            snapshot:
              type: object
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                sizeBytes: { type: integer }
                link: { type: string, format: uri }

    ShareEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [entity, snapshot]
          properties:
            type: { enum: [share.created, share.revoked] }
            entity:
              type: object
              additionalProperties: false
              required: [type, id, documentId, folderId]
              properties:
                type: { const: share }
                id: { $ref: '#/components/schemas/Ulid' }
                documentId: { $ref: '#/components/schemas/Ulid' }
                folderId: { $ref: '#/components/schemas/Ulid' }
            snapshot:
              type: object
              additionalProperties: false
              properties:
                mode: { type: string, enum: [latest, pinned] }
                version: { type: [integer, 'null'] }
                includeAttachments: { type: boolean }
                expiresAt: { type: string, format: date-time }
                createdBy: { type: string }
                revokedAt: { type: [string, 'null'], format: date-time }
            changes:
              type: object
              properties:
                reason: { type: string, enum: [manual, document_deleted, restricted], description: Only in share.revoked. }

    DocumentNotificationEnvelope:
      description: Same as DocumentEventEnvelope without snapshot.relations or changes.relations.
      allOf:
        - $ref: '#/components/schemas/DocumentEventEnvelope'
        - type: object
          properties:
            snapshot:
              not: { required: [relations] }
            changes:
              not: { required: [relations] }

    AccessChangedEnvelope:
      description: |
        Sent to every internal person when an ACL changes. It carries no detail:
        it is the signal for the client to run a full reconciliation.
      type: object
      additionalProperties: false
      required: [eventId, seq, type, version, occurredAt]
      properties:
        eventId: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer }
        type: { const: access.changed }
        version: { const: v1 }
        occurredAt: { type: string, format: date-time }
