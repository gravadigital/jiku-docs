asyncapi: 3.0.0
info:
  title: jiku-docs — commands
  version: 1.3.0
  description: |
    Write plane of jiku-docs (NATS micro service `jiku-docs-commands`).
    Request/reply without persistence. The caller's identity is the subject's `user-id`,
    guaranteed by Jiku's auth-callout. Only Jiku's `api` may send `actor`.
    Every schema rejects unknown keys (additionalProperties: false).
    Every command is safe to retry (client ids and `baseVersion`).

    Implementation notes (1.1.0):
    - Attachments (D-3): the bytes live in core's file service. `attachments.request-upload`
      requests `files.request-upload` from core as the jiku-docs service and returns its `uploadUrl`;
      `confirm` downloads the object and verifies the declared SHA-256. The type and size policy is
      core's; its errors are translated to `attachment_type_not_allowed` / `attachment_too_large`, and
      core being down is `upstream_unavailable`. `attachments_not_configured` is not emitted in v1.
    - Inline `content` over 256 KiB and `size` over 5 MiB reply `content_too_large`
      (not `invalid_fields`), and a `fileName` outside the pattern replies `file_name_invalid`.
    - A command from an external person replies `caller_not_authorized`.
    - `actor` (D-11): `{ id, roles, name?, username?, email? }`, the same envelope the api sends to core.
      The person's class and the per-role ACL rules come from `actor.roles`; authorship, from `actor.id`.
      `users.list` is not queried for the api with `actor`. An `actor` without `roles` is `invalid_fields`.
    - `via`: for service-class callers the origin recorded in versions and in the events' `actor.via`
      is always `service`. In `documents.lock` the lock's `via` (`human`/`agent`) is stored
      as the caller sends it, also if it is a service (jiku-go sends `agent`); the
      `document.locked` event still carries `actor.via: service`.
    - Large content upload: `uploadUrl` is a presigned S3 `PUT` (300 s) of the raw content.
      The signature only covers the host: `Content-Type` is not part of it; the recommended value is
      `text/markdown; charset=utf-8`, which is what jiku-go sends.

    History compaction (1.2.0, docs/history-compaction-v1.md):
    - `documents.{id}.restore` with a pruned `fromVersion` and `shares.new` with `mode: pinned` and a
      pruned `version` reply `version_pruned`, with `errorDetails`
      `{ requestedVersion, previousAvailable, nextAvailable }` (the closest kept
      versions, or `null`). No version or share link is created. A version greater than the current one is still
      `document_not_found`.
    - Saving with `message` (or as a service) protects the version forever; `via: agent` versions
      without a message are compacted in blocks like human ones.

    P-1, documentation without folders (1.3.0, docs/p1/service.md):
    - Permissions by class and visibility, not by folder. `internal` and `public`: any internal
      person (`admin`, `user`) reads and writes. `restricted` (new): only `admin` and services; for a
      `user` or an external person it does not exist (`document_not_found`, `share_not_found`, `attachment_not_found`).
    - Only `admin` (or a service) sets or removes `restricted`, in `documents.new`, `update`, `restore` and
      `relations.update` (the frontmatter is content): a `user` gets `permission_denied`. Marking
      `public` no longer requires `manage`.
    - Share links: any internal person creates and revokes share links of `internal` and `public` documents. A
      `restricted` one does not accept share links (`sharing_blocked` for an admin), and turning a document
      `restricted` revokes its active share links (`share.revoked` with `reason: restricted`).
    - `documents.{id}.unlock` with `force`: only `admin` or a service (`permission_denied` for a `user`).
    - `folders.*` (including `acl.replace`): only `admin` and services; a `user` gets
      `permission_denied`. Folders only organise the files for the CLI and the sync daemon.
    - **Obsolete (no effect):** the ACL rules (`acl.replace`, `inheritAcl`), `externalBlocked` and
      `sharingBlocked`. They are still accepted and stored, but decide nothing. They go away in v2.
    - `documents.new`: `folderId` and `fileName` optional. Without `folderId` the server generates the folder
      from the relations (`/clients/<client>/<project>/`, `/clients/<client>/general/` or
      `/general/`, creating the missing ones); without `fileName`, the title in kebab-case `.md`, unique in the
      folder (`-2`, `-3`...). The reply carries `folderId` and `fileName`. Changing relations afterwards
      does not move the document.
    - New command `documents.{id}.relations.update` (write): `{ baseVersion, add?, remove?, sessionId? }`.
      Rewrites only the `jiku:` block of the frontmatter and creates a version (`kind: update`) with an
      automatic message ("Project assigned: …"). Adding a project adds its client if missing. Ids
      checked against core (`invalid_relation`). No changes: `success` with the current version. Without `via`: the
      origin comes from the caller's class.
    - `document_locked` carries `holder`, `holderName`, `via` and `expiresAt` in `errorDetails`.
    - Author names are stored on write: `actor.name` (or `username`) with the api, the `name`
      from `users.list` over the bus, the service name for a service.
defaultContentType: application/json

servers:
  jiku-nats:
    host: '{natsHost}'
    protocol: nats
    description: Jiku's NATS bus (operator mode, auth-callout with Zitadel).
    variables:
      natsHost:
        default: nats.jiku.local:4222

channels:
  folders.new:
    address: '{instance}.{userId}.jiku-docs-commands.v1.folders.new'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/FoldersNew' } }
      reply: { $ref: '#/components/messages/FolderReply' }
  folders.edit:
    address: '{instance}.{userId}.jiku-docs-commands.v1.folders.{folderId}.edit'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, folderId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/FoldersEdit' } }
      reply: { $ref: '#/components/messages/FolderReply' }
  folders.delete:
    address: '{instance}.{userId}.jiku-docs-commands.v1.folders.{folderId}.delete'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, folderId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/Empty' } }
      reply: { $ref: '#/components/messages/IdReply' }
  folders.acl.replace:
    address: '{instance}.{userId}.jiku-docs-commands.v1.folders.{folderId}.acl.replace'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, folderId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/AclReplace' } }
      reply: { $ref: '#/components/messages/AclReply' }

  documents.new:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.new'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsNew' } }
      reply: { $ref: '#/components/messages/DocumentReply' }
  documents.update:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.update'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsUpdate' } }
      reply: { $ref: '#/components/messages/DocumentReply' }
  documents.move:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.move'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsMove' } }
      reply: { $ref: '#/components/messages/DocumentReply' }
  documents.delete:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.delete'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/BaseVersionOnly' } }
      reply: { $ref: '#/components/messages/IdReply' }
  documents.restore:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.restore'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsRestore' } }
      reply: { $ref: '#/components/messages/DocumentReply' }
  documents.lock:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.lock'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsLock' } }
      reply: { $ref: '#/components/messages/LockReply' }
  documents.unlock:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.unlock'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsUnlock' } }
      reply: { $ref: '#/components/messages/IdReply' }
  documents.relations.update:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.{documentId}.relations.update'
    description: 'P-1, "Asignar proyecto" (assign project): changes only the relations of the frontmatter, with a base version.'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, documentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/RelationsUpdate' } }
      reply: { $ref: '#/components/messages/RelationsReply' }
  documents.request-content-upload:
    address: '{instance}.{userId}.jiku-docs-commands.v1.documents.request-content-upload'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/ContentUploadRequest' } }
      reply: { $ref: '#/components/messages/ContentUploadReply' }

  attachments.request-upload:
    address: '{instance}.{userId}.jiku-docs-commands.v1.attachments.request-upload'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/AttachmentUploadRequest' } }
      reply: { $ref: '#/components/messages/AttachmentUploadReply' }
  attachments.confirm:
    address: '{instance}.{userId}.jiku-docs-commands.v1.attachments.{attachmentId}.confirm'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, attachmentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/Empty' } }
      reply: { $ref: '#/components/messages/AttachmentConfirmReply' }
  attachments.request-download:
    address: '{instance}.{userId}.jiku-docs-commands.v1.attachments.{attachmentId}.request-download'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, attachmentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/Empty' } }
      reply: { $ref: '#/components/messages/AttachmentDownloadReply' }
  attachments.delete:
    address: '{instance}.{userId}.jiku-docs-commands.v1.attachments.{attachmentId}.delete'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, attachmentId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/Empty' } }
      reply: { $ref: '#/components/messages/IdReply' }

  shares.new:
    address: '{instance}.{userId}.jiku-docs-commands.v1.shares.new'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/SharesNew' } }
      reply: { $ref: '#/components/messages/ShareNewReply' }
  shares.revoke:
    address: '{instance}.{userId}.jiku-docs-commands.v1.shares.{shareId}.revoke'
    parameters: { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' }, shareId: { $ref: '#/components/parameters/ulidParam' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/Empty' } }
      reply: { $ref: '#/components/messages/ShareRevokeReply' }

operations:
  foldersNew:          { action: receive, channel: { $ref: '#/channels/folders.new' },          reply: { channel: { $ref: '#/channels/folders.new' } },          x-permission: admin or service, x-error-codes: [folder_not_found, already_exists, permission_denied] }
  foldersEdit:         { action: receive, channel: { $ref: '#/channels/folders.edit' },         reply: { channel: { $ref: '#/channels/folders.edit' } },         x-permission: admin or service, x-error-codes: [folder_not_found, already_exists, permission_denied, invalid_fields] }
  foldersDelete:       { action: receive, channel: { $ref: '#/channels/folders.delete' },       reply: { channel: { $ref: '#/channels/folders.delete' } },       x-permission: admin or service, x-error-codes: [folder_not_found, folder_not_empty, permission_denied] }
  foldersAclReplace:   { action: receive, channel: { $ref: '#/channels/folders.acl.replace' },  reply: { channel: { $ref: '#/channels/folders.acl.replace' } },  x-permission: admin or service (obsolete, the rules have no effect), x-error-codes: [folder_not_found, permission_denied, invalid_fields] }
  documentsNew:        { action: receive, channel: { $ref: '#/channels/documents.new' },        reply: { channel: { $ref: '#/channels/documents.new' } },        x-permission: internal person or service (restricted admin only), x-error-codes: [folder_not_found, already_exists, file_name_invalid, frontmatter_invalid, invalid_relation, content_too_large, checksum_mismatch, upload_not_found, permission_denied, upstream_unavailable] }
  documentsUpdate:     { action: receive, channel: { $ref: '#/channels/documents.update' },     reply: { channel: { $ref: '#/channels/documents.update' } },     x-permission: write, x-error-codes: [document_not_found, version_conflict, document_locked, frontmatter_invalid, invalid_relation, content_too_large, checksum_mismatch, upload_not_found, permission_denied, upstream_unavailable] }
  documentsMove:       { action: receive, channel: { $ref: '#/channels/documents.move' },       reply: { channel: { $ref: '#/channels/documents.move' } },       x-permission: write (source and destination), x-error-codes: [document_not_found, folder_not_found, version_conflict, document_locked, already_exists, file_name_invalid, permission_denied] }
  documentsDelete:     { action: receive, channel: { $ref: '#/channels/documents.delete' },     reply: { channel: { $ref: '#/channels/documents.delete' } },     x-permission: write, x-error-codes: [document_not_found, version_conflict, document_locked, permission_denied] }
  documentsRestore:    { action: receive, channel: { $ref: '#/channels/documents.restore' },    reply: { channel: { $ref: '#/channels/documents.restore' } },    x-permission: write, x-error-codes: [document_not_found, version_pruned, version_conflict, document_locked, permission_denied] }
  documentsLock:       { action: receive, channel: { $ref: '#/channels/documents.lock' },       reply: { channel: { $ref: '#/channels/documents.lock' } },       x-permission: write, x-error-codes: [document_not_found, document_locked, permission_denied] }
  documentsUnlock:     { action: receive, channel: { $ref: '#/channels/documents.unlock' },     reply: { channel: { $ref: '#/channels/documents.unlock' } },     x-permission: write (force admin or service only), x-error-codes: [document_not_found, lock_not_held, permission_denied] }
  relationsUpdate:     { action: receive, channel: { $ref: '#/channels/documents.relations.update' }, reply: { channel: { $ref: '#/channels/documents.relations.update' } }, x-permission: write, x-error-codes: [document_not_found, version_conflict, document_locked, frontmatter_invalid, invalid_relation, invalid_fields, permission_denied, upstream_unavailable] }
  contentUpload:       { action: receive, channel: { $ref: '#/channels/documents.request-content-upload' }, reply: { channel: { $ref: '#/channels/documents.request-content-upload' } }, x-permission: internal person or service, x-error-codes: [content_too_large, caller_not_authorized] }
  attachmentsUpload:   { action: receive, channel: { $ref: '#/channels/attachments.request-upload' },   reply: { channel: { $ref: '#/channels/attachments.request-upload' } },   x-permission: write (document), x-error-codes: [document_not_found, attachment_type_not_allowed, attachment_too_large, already_exists, permission_denied, upstream_unavailable] }
  attachmentsConfirm:  { action: receive, channel: { $ref: '#/channels/attachments.confirm' },  reply: { channel: { $ref: '#/channels/attachments.confirm' } },  x-permission: the same caller that requested the upload, x-error-codes: [attachment_not_found, upload_not_found, checksum_mismatch, permission_denied, upstream_unavailable] }
  attachmentsDownload: { action: receive, channel: { $ref: '#/channels/attachments.request-download' }, reply: { channel: { $ref: '#/channels/attachments.request-download' } }, x-permission: read (document), x-error-codes: [attachment_not_found, upstream_unavailable] }
  attachmentsDelete:   { action: receive, channel: { $ref: '#/channels/attachments.delete' },   reply: { channel: { $ref: '#/channels/attachments.delete' } },   x-permission: write (document), x-error-codes: [attachment_not_found, permission_denied] }

  sharesNew:           { action: receive, channel: { $ref: '#/channels/shares.new' },           reply: { channel: { $ref: '#/channels/shares.new' } },           x-permission: write (any internal person; restricted does not accept share links), x-error-codes: [document_not_found, version_pruned, permission_denied, sharing_blocked, share_expiry_invalid, secret_warning_not_acknowledged, already_exists] }
  sharesRevoke:        { action: receive, channel: { $ref: '#/channels/shares.revoke' },        reply: { channel: { $ref: '#/channels/shares.revoke' } },        x-permission: any internal person who reads the document, x-error-codes: [share_not_found, permission_denied] }

components:
  parameters:
    instance:
      description: Installation (`dev` / `prod`), same as Jiku's NATS_INSTANCE.
      enum: [dev, prod]
    userId:
      description: 'Zitadel `sub` of the caller, raw. The auth-callout only allows the caller''s own.'
    ulidParam:
      description: Uppercase ULID (26 characters, Crockford alphabet).

  messages:
    FolderReply:     { payload: { $ref: '#/components/schemas/ReplyFolder' } }
    IdReply:         { payload: { $ref: '#/components/schemas/ReplyId' } }
    AclReply:        { payload: { $ref: '#/components/schemas/ReplyAcl' } }
    DocumentReply:   { payload: { $ref: '#/components/schemas/ReplyDocument' } }
    LockReply:       { payload: { $ref: '#/components/schemas/ReplyLock' } }
    ContentUploadReply:      { payload: { $ref: '#/components/schemas/ReplyContentUpload' } }
    AttachmentUploadReply:   { payload: { $ref: '#/components/schemas/ReplyAttachmentUpload' } }
    AttachmentConfirmReply:  { payload: { $ref: '#/components/schemas/ReplyAttachmentConfirm' } }
    AttachmentDownloadReply: { payload: { $ref: '#/components/schemas/ReplyAttachmentDownload' } }
    ShareNewReply:           { payload: { $ref: '#/components/schemas/ReplyShareNew' } }
    ShareRevokeReply:        { payload: { $ref: '#/components/schemas/ReplyShareRevoke' } }
    RelationsReply:          { payload: { $ref: '#/components/schemas/ReplyRelations' } }

  schemas:
    # ---------- base types ----------
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Checksum:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    FileName:
      type: string
      pattern: '^[^/\\]{1,200}\.md$'
    Via:
      type: string
      enum: [human, agent, service]
      description: Origin of the change. For service-class callers it is forced to `service`.
    Actor:
      type: object
      description: 'Person on whose behalf the `api` acts (D-11): the same `actor` the api sends to core, built from the already verified web token. Only accepted if the caller is the `api`. The person''s class comes from `roles` (`admin`/`user` → internal, `external-user` → external, other → `caller_not_authorized`); `users.list` is not queried.'
      additionalProperties: false
      required: [id, roles]
      properties:
        id: { type: string, minLength: 1, maxLength: 200, description: 'Zitadel `sub` of the person' }
        roles: { type: array, maxItems: 50, items: { type: string }, description: 'Product roles of the verified web token.' }
        name: { type: string, maxLength: 500 }
        username: { type: string, maxLength: 500 }
        email: { type: string, maxLength: 500 }
    Empty:
      type: object
      additionalProperties: false
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
    BaseVersionOnly:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        baseVersion: { type: integer, minimum: 1 }

    # ---------- folders ----------
    FoldersNew:
      type: object
      additionalProperties: false
      required: [id, parentId, name]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        parentId: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, minLength: 1, maxLength: 120, pattern: '^[^/\\]+$' }
        inheritAcl: { type: boolean, default: true, deprecated: true, description: 'Obsolete since 1.3.0: the ACL rules have no effect.' }
        externalBlocked: { type: boolean, default: false, deprecated: true, description: 'Obsolete since 1.3.0: no effect, replaced by visibility.' }
        sharingBlocked: { type: boolean, default: false, deprecated: true, description: 'Obsolete since 1.3.0: no effect; a restricted document does not accept share links.' }
    FoldersEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        name: { type: string, minLength: 1, maxLength: 120, pattern: '^[^/\\]+$' }
        parentId: { $ref: '#/components/schemas/Ulid' }
        inheritAcl: { type: boolean, deprecated: true }
        externalBlocked: { type: boolean, deprecated: true }
        sharingBlocked: { type: boolean, deprecated: true }
    AclRule:
      type: object
      additionalProperties: false
      required: [principalType, principal, permission]
      properties:
        principalType: { type: string, enum: [role, user] }
        principal: { type: string, minLength: 1, maxLength: 200 }
        permission: { type: string, enum: [read, write, manage] }
    AclReplace:
      type: object
      deprecated: true
      description: 'Obsolete since 1.3.0: the rules are stored but do not decide permissions (P-1).'
      additionalProperties: false
      required: [rules]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        rules:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AclRule' }

    # ---------- documents ----------
    ContentSource:
      description: Exactly one of `content` (up to 256 KiB) or `contentUploadId`.
      oneOf:
        - required: [content]
        - required: [contentUploadId]
    DocumentsNew:
      type: object
      additionalProperties: false
      required: [id, checksum]
      allOf: [{ $ref: '#/components/schemas/ContentSource' }]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        folderId: { $ref: '#/components/schemas/Ulid', description: 'Optional (1.3.0): without it the folder comes from the relations of the frontmatter.' }
        fileName: { $ref: '#/components/schemas/FileName', description: 'Optional (1.3.0): without it, the title in kebab-case .md, unique in the folder.' }
        content: { type: string, maxLength: 262144 }
        contentUploadId: { $ref: '#/components/schemas/Ulid' }
        checksum: { $ref: '#/components/schemas/Checksum' }
        via: { $ref: '#/components/schemas/Via' }
        message: { type: string, maxLength: 500 }
    DocumentsUpdate:
      type: object
      additionalProperties: false
      required: [baseVersion, checksum]
      allOf: [{ $ref: '#/components/schemas/ContentSource' }]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        baseVersion: { type: integer, minimum: 1 }
        content: { type: string, maxLength: 262144 }
        contentUploadId: { $ref: '#/components/schemas/Ulid' }
        checksum: { $ref: '#/components/schemas/Checksum' }
        sessionId: { $ref: '#/components/schemas/Ulid' }
        via: { $ref: '#/components/schemas/Via' }
        message: { type: string, maxLength: 500 }
    DocumentsMove:
      type: object
      additionalProperties: false
      required: [baseVersion]
      anyOf: [{ required: [folderId] }, { required: [fileName] }]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        baseVersion: { type: integer, minimum: 1 }
        folderId: { $ref: '#/components/schemas/Ulid' }
        fileName: { $ref: '#/components/schemas/FileName' }
        sessionId: { $ref: '#/components/schemas/Ulid' }
    DocumentsRestore:
      type: object
      additionalProperties: false
      required: [fromVersion, baseVersion]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        fromVersion: { type: integer, minimum: 1 }
        baseVersion: { type: integer, minimum: 1 }
    DocumentsLock:
      type: object
      additionalProperties: false
      required: [sessionId, via]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        sessionId: { $ref: '#/components/schemas/Ulid' }
        via: { type: string, enum: [human, agent], description: 'Stored as is in the lock, also for services.' }
        ttlSeconds: { type: integer, minimum: 30, maximum: 300, default: 120 }
    DocumentsUnlock:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        sessionId: { $ref: '#/components/schemas/Ulid' }
        force: { type: boolean, default: false, description: 'Releases the lock of another session. Admin or service only.' }
    RelationSet:
      type: object
      additionalProperties: false
      properties:
        clients: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
        projects: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
        requirements: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
        tasks: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
    Relations:
      type: object
      additionalProperties: false
      required: [clients, projects, requirements, tasks]
      properties:
        clients: { type: array, items: { type: integer } }
        projects: { type: array, items: { type: integer } }
        requirements: { type: array, items: { type: integer } }
        tasks: { type: array, items: { type: integer } }
    RelationsUpdate:
      type: object
      additionalProperties: false
      required: [baseVersion]
      description: 'At least one id in add or remove (otherwise invalid_fields); an id in both is invalid_fields. Result = (current ∪ add) \ remove, plus the client of each added project. Without via: the origin comes from the caller''s class.'
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        baseVersion: { type: integer, minimum: 1 }
        add: { $ref: '#/components/schemas/RelationSet' }
        remove: { $ref: '#/components/schemas/RelationSet' }
        sessionId: { $ref: '#/components/schemas/Ulid', description: 'The session that holds the lock, if whoever assigns is editing.' }
    ContentUploadRequest:
      type: object
      additionalProperties: false
      required: [checksum, size]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        checksum: { $ref: '#/components/schemas/Checksum' }
        size: { type: integer, minimum: 1, maximum: 5242880 }

    # ---------- attachments ----------
    AttachmentUploadRequest:
      type: object
      additionalProperties: false
      required: [id, documentId, fileName, mimeType, fileSize, checksum]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        documentId: { $ref: '#/components/schemas/Ulid' }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, maxLength: 127 }
        fileSize: { type: integer, minimum: 1 }
        checksum: { $ref: '#/components/schemas/Checksum' }

    # ---------- share links ----------
    SharesNew:
      type: object
      additionalProperties: false
      required: [id, documentId, mode, expiresAt]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        documentId: { $ref: '#/components/schemas/Ulid' }
        mode: { type: string, enum: [latest, pinned] }
        version: { type: integer, minimum: 1, description: 'Required with mode pinned; with mode latest it is invalid_fields.' }
        expiresAt: { type: string, format: date-time, description: 'In the future and at most 180 days from now.' }
        includeAttachments: { type: boolean, default: true }
        note: { type: string, maxLength: 300, description: 'Who or what the share link is for. Visible internally only.' }
        acknowledgeSecretWarning: { type: boolean, default: false }
      if: { properties: { mode: { const: pinned } } }
      then: { required: [version] }

    # ---------- replies ----------
    Failure:
      type: object
      additionalProperties: false
      required: [status, errorCode, errorMessage]
      properties:
        status: { const: failure }
        errorCode:
          type: string
          description: Open catalogue within v1; an unknown code is treated as a generic error.
          examples: [invalid_fields, document_not_found, folder_not_found, attachment_not_found, permission_denied, version_conflict, version_pruned, document_locked, lock_not_held, already_exists, file_name_invalid, frontmatter_invalid, invalid_relation, content_too_large, checksum_mismatch, upload_not_found, folder_not_empty, attachment_type_not_allowed, attachment_too_large, share_not_found, sharing_blocked, share_expiry_invalid, secret_warning_not_acknowledged, attachments_not_configured, unknown_caller, caller_not_authorized, upstream_unavailable, internal_error]
        errorMessage: { type: string, description: Human-readable text for the interface. Do not branch on this field. }
        errorDetails: { type: object }
    ReplyId:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, required: [id], properties: { id: { type: string } } }
        - $ref: '#/components/schemas/Failure'
    ReplyFolder:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, required: [id, path], properties: { id: { $ref: '#/components/schemas/Ulid' }, path: { type: string, description: 'Path of the folder, always with / at the start and the end.' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyAcl:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, rules]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                rules: { type: array, items: { $ref: '#/components/schemas/AclRule' } }
        - $ref: '#/components/schemas/Failure'
    ReplyDocument:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, version]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                version: { type: integer }
                path: { type: string }
                folderId: { $ref: '#/components/schemas/Ulid', description: 'documents.new only: the folder, given or generated.' }
                fileName: { type: string, description: 'documents.new only: the name, given or generated.' }
                warnings:
                  type: array
                  description: Non-blocking warnings, for example `possible_secret_detected`.
                  items: { type: string }
        - $ref: '#/components/schemas/Failure'
    ReplyRelations:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, version, relations]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                version: { type: integer, description: 'The new version, or the current one if nothing changed.' }
                relations: { $ref: '#/components/schemas/Relations' }
                warnings: { type: array, items: { type: string } }
        - $ref: '#/components/schemas/Failure'
    ReplyLock:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, sessionId, expiresAt]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                sessionId: { $ref: '#/components/schemas/Ulid' }
                expiresAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/Failure'
    ReplyContentUpload:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [contentUploadId, uploadUrl, expiresIn]
              properties:
                contentUploadId: { $ref: '#/components/schemas/Ulid' }
                uploadUrl: { type: string, format: uri, description: 'PUT of the raw content. Content-Type is not signed (recommended text/markdown; charset=utf-8).' }
                expiresIn: { type: integer, description: Seconds }
        - $ref: '#/components/schemas/Failure'
    ReplyAttachmentUpload:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, uploadUrl, expiresIn, link]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                uploadUrl: { type: string, format: uri }
                expiresIn: { type: integer }
                link: { type: string, format: uri, description: 'Stable URL for the markdown: {JIKU_WEB_URL}/docs/attachments/{id} (D-5).' }
        - $ref: '#/components/schemas/Failure'
    ReplyAttachmentConfirm:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, required: [id, status], properties: { id: { $ref: '#/components/schemas/Ulid' }, status: { const: ready } } }
        - $ref: '#/components/schemas/Failure'
    ReplyAttachmentDownload:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, downloadUrl, expiresIn]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                downloadUrl: { type: string, format: uri }
                expiresIn: { type: integer }
        - $ref: '#/components/schemas/Failure'
    ReplyShareNew:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, token, url, expiresAt]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                token: { type: string, pattern: '^jds_[A-Za-z0-9_-]{43}$', description: 'Returned only here. Only its SHA-256 is stored.' }
                url: { type: string, format: uri, description: 'https://{JIKU_PUBLIC_URL}/p/docs/{token}' }
                expiresAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/Failure'
    ReplyShareRevoke:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [id, revokedAt]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                revokedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/Failure'
