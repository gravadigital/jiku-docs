name: CI

on:
  push:
    branches: [main, dev]
    # Docs-only changes do not need the full suite. The contracts in docs/apis/ are NOT docs:
    # the contract tests read them, so they still trigger CI.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

      # Unit, contract and integration tests. The integration suite starts PostgreSQL 16 and MinIO
      # with testcontainers (Docker is available on the runner) and an embedded nats-server.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Docker build
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t jiku-docs:ci .
