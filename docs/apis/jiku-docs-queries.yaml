asyncapi: 3.0.0
info:
  title: jiku-docs — queries
  version: 1.3.0
  description: |
    Read plane of jiku-docs (NATS micro service `jiku-docs-queries`).
    Same grammar as core's `jiku-queries`: filter / sort / page / fields / include / count.
    Every query filters by permissions before returning or paginating.
    What is not visible answers `*_not_found` (indistinguishable from "does not exist").
    A name not declared in filter, sort, fields or include is `invalid_fields`.
    `meta.describe` is the authoritative source of fields, filters, sorts and enums.

    Implementation notes (1.1.0):
    - `page.limit` above 200 is silently clamped to 200, like core (`meta.describe`
      publishes it as `defaults.maxLimit`).
    - External clients (`person-external`) do not see folders: `folders.list` returns them
      `items: []` and `folders.get`, `folder_not_found`. They see documents, not the tree.
    - `documents.search` returns the best fragment of each document (one result per document).
    - Path format: the `path` of a folder starts and ends with `/` (the root is `/`, a
      subfolder `/clients/acme/`); the path of a document is its folder's path plus the file
      name (`/clients/acme/acta.md`). The `path` filter (exact, case-insensitive) of
      `folders.list` accepts the path with or without the trailing `/`; `filter.path: "/"` returns the root.
    - `documents.get` with `version` returns the metadata of that version (`version`, `checksum`,
      `sizeBytes`, `title`, `updatedAt` and `updatedBy` are those of the requested version); relations,
      topics, lock and attachments are always the current ones.
    - `actor` (D-11): `{ id, roles, name?, username?, email? }`, the same envelope the api sends to core.
      The class of the person comes from `actor.roles` (`users.list` is not queried); the
      `project-permissions` of an external person are still requested from core. An `actor` without `roles` is
      `invalid_fields`.
    - Frontmatter hidden from external persons (D-11): a `person-external` gets `documents.get` without
      frontmatter, both in `content` and in `contentUrl`, and in that reply `checksum` and `sizeBytes`
      are those of the body it receives. The same in `documents.versions.list` (which for an external person only
      has the current version). In `documents.list`, `documents.changes` and the events, `checksum`
      identifies the stored version (full file): for an external person it serves to detect changes,
      not to verify the content received. The snippets of `documents.search` never include
      frontmatter.

    History compaction (1.2.0, docs/history-compaction-v1.md):
    - A daily process deletes old intermediate versions: the numbering of
      `documents.versions.list` can have gaps. Each version carries `kind` (`create`, `update`,
      `restore`; moving does not create a version) and `protected` (permanent protection: creation,
      restore, with `message` or with `via: service`). The current version and those pinned by an active
      `pinned` share link are not deleted either, even if `protected` is `false`. New filters: `kind` and
      `protected`.
    - `documents.get` with a pruned `version` answers `version_pruned` with `errorDetails`
      `{ requestedVersion, previousAvailable, nextAvailable }` (the closest kept ones, or
      `null`). A version greater than the current one is still `document_not_found`.
    - A `person-external` never receives `version_pruned`: any version other than the current one is
      `document_not_found`, without `errorDetails`.
    - `documents.get` returns `prunedVersionsCount` (how many versions were pruned) as a base
      field; it is not returned to an external person.

    P-1, documentation without folders (1.3.0, docs/p1/service.md):
    - Visibility `restricted`: only `admin` and services read it. For a `user` or an external person it does not exist
      through any path: `documents.list` (and its `count`), `get` (with and without `version`), `search` and its
      fragments, `changes`, `versions.list`, `topics.list` (the counts do not count it),
      `attachments.list`, `shares.*`, `suggest-relations`. It answers `document_not_found` or omits it.
    - `filter.visibility: restricted` requested by someone who cannot read it returns an **empty list**
      (never `invalid_fields`): it reveals nothing.
    - Folders: internal persons see all of them (`effectivePermission`: `write` for `user`, `manage`
      for `admin` and services); `include: [acl]` only admin and services (`permission_denied`). The
      ACL rules, `inheritAcl`, `externalBlocked` and `sharingBlocked` are **obsolete**: they are returned
      but have no effect.
    - New filters in `documents.list` and `documents.search`: `hasProject`, `hasClient`, `hasTopic`
      (boolean). `hasProject: false` is "Sin proyecto" (no project): no direct relation with a project, nor
      through a requirement nor through a task. `hasClient` looks at `jiku.clients`; `hasTopic`, the topics.
    - With `filter.projectId` (also inside `or`), each item of `list` and `search` carries
      `projectMatch`: `direct` (the project is in `jiku.projects`) or `indirect` (it comes through a
      requirement or a task of the project).
    - Names: `createdByName` and `updatedByName` in `list`, `get` and `search`; `authorName` in
      `versions.list`; `holderName` in `lock`. They are stored on write; `null` if unknown. If
      the api's `actor` arrives without `name` or `username`, the name comes from core's `users`; a
      stored `null` name is filled in on read from core when core knows it (without writing it). If
      core does not answer, the name stays `null`: the query never fails because of that.
    - `clients` and `projects` (ids of `jiku.clients` and `jiku.projects`) in each item of `list`, `get` and
      `search`. An external person only gets the projects of their `project-permissions` and no
      client; the same in `include: [relations]`.
    - New query `documents.suggest-relations` `{ id }` (requires reading the document; an external person
      gets `permission_denied`): `{ items: [{ projectId, clientId, score, reason }] }`, up to 5,
      by matches of names, parts of the name or code of projects and names of clients from
      core in the title (weighs more) and the content. Excludes projects already related. A
      client-only candidate (the text names the client and none of its projects matches) carries
      `projectId: null`; never `0`. `score` between 0 and 1.
defaultContentType: application/json

servers:
  jiku-nats:
    host: '{natsHost}'
    protocol: nats
    variables:
      natsHost:
        default: nats.jiku.local:4222

channels:
  meta.describe:
    address: '{instance}.{userId}.jiku-docs-queries.v1.meta.describe'
    parameters: &p { instance: { $ref: '#/components/parameters/instance' }, userId: { $ref: '#/components/parameters/userId' } }
    messages:
      request: { payload: { $ref: '#/components/schemas/DescribeQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyAny' } }
  folders.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.folders.list'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/FoldersListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyFolderPage' } }
  folders.get:
    address: '{instance}.{userId}.jiku-docs-queries.v1.folders.get'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/FoldersGetQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyFolder' } }
  documents.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.list'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyDocumentPage' } }
  documents.get:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.get'
    description: An external person only reads the current version; another `version` answers document_not_found without errorDetails (it may predate publication). For an internal person, a pruned version answers version_pruned.
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/DocumentsGetQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyDocument' } }
  documents.versions.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.versions.list'
    description: An external person is only listed the current version. The numbering can have gaps (pruned versions).
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/VersionsListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyVersionPage' } }
  documents.search:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.search'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/SearchQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplySearch' } }
  documents.changes:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.changes'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/ChangesQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyChanges' } }
  documents.suggest-relations:
    address: '{instance}.{userId}.jiku-docs-queries.v1.documents.suggest-relations'
    description: 'P-1, "Asignar sugerido" (assign suggested): project (or client) candidates by title and content.'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/SuggestRelationsQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplySuggestRelations' } }
  topics.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.topics.list'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/TopicsListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyTopics' } }
  attachments.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.attachments.list'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/AttachmentsListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyAttachments' } }

  shares.list:
    address: '{instance}.{userId}.jiku-docs-queries.v1.shares.list'
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/SharesListQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyShares' } }
  shares.resolve:
    address: '{instance}.{userId}.jiku-docs-queries.v1.shares.resolve'
    description: Only the Jiku api, without actor. Any other caller gets caller_not_authorized.
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/ShareResolveQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyShareResolve' } }
  shares.attachment:
    address: '{instance}.{userId}.jiku-docs-queries.v1.shares.attachment'
    description: Only the Jiku api, without actor.
    parameters: *p
    messages:
      request: { payload: { $ref: '#/components/schemas/ShareAttachmentQuery' } }
      reply: { payload: { $ref: '#/components/schemas/ReplyShareAttachment' } }

operations:
  metaDescribe:      { action: receive, channel: { $ref: '#/channels/meta.describe' },           reply: { channel: { $ref: '#/channels/meta.describe' } } }
  foldersList:       { action: receive, channel: { $ref: '#/channels/folders.list' },            reply: { channel: { $ref: '#/channels/folders.list' } },            x-error-codes: [invalid_fields, invalid_cursor, query_timeout] }
  foldersGet:        { action: receive, channel: { $ref: '#/channels/folders.get' },             reply: { channel: { $ref: '#/channels/folders.get' } },             x-error-codes: [invalid_fields, folder_not_found, permission_denied] }
  documentsList:     { action: receive, channel: { $ref: '#/channels/documents.list' },          reply: { channel: { $ref: '#/channels/documents.list' } },          x-error-codes: [invalid_fields, invalid_cursor, query_timeout, upstream_unavailable] }
  documentsGet:      { action: receive, channel: { $ref: '#/channels/documents.get' },           reply: { channel: { $ref: '#/channels/documents.get' } },           x-error-codes: [invalid_fields, document_not_found, version_pruned] }
  versionsList:      { action: receive, channel: { $ref: '#/channels/documents.versions.list' }, reply: { channel: { $ref: '#/channels/documents.versions.list' } }, x-error-codes: [invalid_fields, invalid_cursor, document_not_found] }
  documentsSearch:   { action: receive, channel: { $ref: '#/channels/documents.search' },        reply: { channel: { $ref: '#/channels/documents.search' } },        x-error-codes: [invalid_fields, query_timeout, upstream_unavailable, semantic_search_not_configured] }
  documentsChanges:  { action: receive, channel: { $ref: '#/channels/documents.changes' },       reply: { channel: { $ref: '#/channels/documents.changes' } },       x-error-codes: [invalid_fields, invalid_cursor] }
  suggestRelations:  { action: receive, channel: { $ref: '#/channels/documents.suggest-relations' }, reply: { channel: { $ref: '#/channels/documents.suggest-relations' } }, x-error-codes: [invalid_fields, document_not_found, permission_denied, upstream_unavailable] }
  topicsList:        { action: receive, channel: { $ref: '#/channels/topics.list' },             reply: { channel: { $ref: '#/channels/topics.list' } },             x-error-codes: [invalid_fields] }
  attachmentsList:   { action: receive, channel: { $ref: '#/channels/attachments.list' },        reply: { channel: { $ref: '#/channels/attachments.list' } },        x-error-codes: [invalid_fields, document_not_found] }

  sharesList:        { action: receive, channel: { $ref: '#/channels/shares.list' },             reply: { channel: { $ref: '#/channels/shares.list' } },             x-permission: internal person who reads the document, x-error-codes: [invalid_fields, invalid_cursor, document_not_found, permission_denied] }
  sharesResolve:     { action: receive, channel: { $ref: '#/channels/shares.resolve' },          reply: { channel: { $ref: '#/channels/shares.resolve' } },          x-permission: only the api caller without actor, x-error-codes: [share_not_found, caller_not_authorized] }
  sharesAttachment:  { action: receive, channel: { $ref: '#/channels/shares.attachment' },       reply: { channel: { $ref: '#/channels/shares.attachment' } },       x-permission: only the api caller without actor, x-error-codes: [share_not_found, caller_not_authorized] }

components:
  parameters:
    instance: { enum: [dev, prod] }
    userId: { description: 'Zitadel `sub` of the caller.' }

  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    Actor:
      type: object
      description: 'Person on whose behalf the `api` acts (D-11): the same `actor` the api sends to core, built from the already verified web token. Only accepted if the caller is the `api`. The class of the person comes from `roles` (`admin`/`user` → internal, `external-user` → external, other → `caller_not_authorized`); `users.list` is not queried.'
      additionalProperties: false
      required: [id, roles]
      properties:
        id: { type: string, minLength: 1, maxLength: 200, description: 'Zitadel `sub` of the person' }
        roles: { type: array, maxItems: 50, items: { type: string }, description: 'Product roles of the verified web token.' }
        name: { type: string, maxLength: 500 }
        username: { type: string, maxLength: 500 }
        email: { type: string, maxLength: 500 }
    DateRange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gte: { type: string, format: date-time }
        lte: { type: string, format: date-time }
    IntOrList:
      oneOf: [{ type: integer }, { type: array, items: { type: integer }, maxItems: 200 }]
    StrOrList:
      oneOf: [{ type: string }, { type: array, items: { type: string }, maxItems: 200 }]
    Page:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, default: 50, description: 'Effective maximum 200: a larger value is silently clamped, as in core.' }
        cursor: { type: [string, 'null'] }
    Empty:
      type: object
      additionalProperties: false
      properties: { actor: { $ref: '#/components/schemas/Actor' } }
    DescribeQuery:
      type: object
      additionalProperties: false
      description: 'Same as core: `resources` is optional; omitted, it describes all; an empty list or an unknown name is invalid_fields.'
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        resources:
          type: array
          minItems: 1
          items: { type: string, enum: [folders, documents, documents.versions, topics, attachments, shares] }
    ClientInfo:
      type: object
      additionalProperties: false
      description: 'Browser data the api forwards to audit the access to the share link. The IP is stored only as an HMAC; the user agent is truncated to 200 characters.'
      properties:
        ip: { type: string, maxLength: 100 }
        userAgent: { type: string, maxLength: 2000 }

    # ---------- folders ----------
    FoldersListQuery:
      type: object
      additionalProperties: false
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter:
          type: object
          additionalProperties: false
          properties:
            id: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: array, items: { $ref: '#/components/schemas/Ulid' } }] }
            parentId: { $ref: '#/components/schemas/Ulid' }
            path: { type: string, description: 'Exact path, case-insensitive; with or without the trailing /. "/" is the root.' }
            pathPrefix: { type: string }
        sort: { type: array, items: { type: string, enum: [path, -path, name, -name, createdAt, -createdAt] } }
        page: { $ref: '#/components/schemas/Page' }
        fields: { type: array, items: { type: string, enum: [id, name, path, parentId, inheritAcl, externalBlocked, sharingBlocked, createdAt, createdBy] } }
        include: { type: array, items: { type: string, enum: [effectivePermission] } }
        count: { oneOf: [{ type: boolean }, { const: only }] }
    FoldersGetQuery:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        fields: { type: array, items: { type: string } }
        include: { type: array, items: { type: string, enum: [acl, effectivePermission] }, description: '`acl` (obsolete) only admin and services; otherwise permission_denied.' }

    # ---------- documents ----------
    DocumentsFilter:
      type: object
      additionalProperties: false
      properties:
        id: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: array, items: { $ref: '#/components/schemas/Ulid' }, maxItems: 200 }] }
        folderId: { $ref: '#/components/schemas/Ulid' }
        path: { type: string, description: 'Exact path of the document (folder + file name), case-insensitive.' }
        pathPrefix: { type: string }
        clientId: { $ref: '#/components/schemas/IntOrList' }
        projectId: { $ref: '#/components/schemas/IntOrList', description: Includes documents related to requirements or tasks of the project. }
        requirementId: { $ref: '#/components/schemas/IntOrList' }
        taskId: { $ref: '#/components/schemas/IntOrList' }
        topic: { $ref: '#/components/schemas/StrOrList' }
        visibility: { type: string, enum: [internal, public, restricted], description: 'restricted requested by someone who does not read it: empty list.' }
        createdBy: { $ref: '#/components/schemas/StrOrList' }
        updatedBy: { $ref: '#/components/schemas/StrOrList' }
        createdAt: { $ref: '#/components/schemas/DateRange' }
        updatedAt: { $ref: '#/components/schemas/DateRange' }
        fileName: { type: string, description: Prefix, case-insensitive. }
        deleted: { type: boolean, default: false }
        hasProject: { type: boolean, description: 'false = "Sin proyecto" (no project): neither direct nor through a requirement or task.' }
        hasClient: { type: boolean, description: 'false = "Sin cliente" (no client: no jiku.clients).' }
        hasTopic: { type: boolean, description: 'false = "Sin tema" (no topic).' }
        or:
          type: array
          maxItems: 10
          description: A single level. Each element accepts the same filters, without `or`.
          items: { type: object }
    DocumentsListQuery:
      type: object
      additionalProperties: false
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter: { $ref: '#/components/schemas/DocumentsFilter' }
        sort: { type: array, items: { type: string, enum: [updatedAt, -updatedAt, createdAt, -createdAt, title, -title, path, -path] } }
        page: { $ref: '#/components/schemas/Page' }
        fields:
          type: array
          items: { type: string, enum: [id, title, path, folderId, fileName, version, checksum, sizeBytes, visibility, createdAt, createdBy, createdByName, updatedAt, updatedBy, updatedByName, deletedAt, clients, projects] }
          description: 'Default: id, title, path, folderId, version, visibility, updatedAt, updatedBy, updatedByName, clients, projects.'
        include: { type: array, items: { type: string, enum: [relations, topics, lock] } }
        count: { oneOf: [{ type: boolean }, { const: only }] }
    DocumentsGetQuery:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, minimum: 1, description: Defaults to the current version. }
        fields: { type: array, items: { type: string } }
        include: { type: array, items: { type: string, enum: [content, relations, topics, lock, attachments] } }
    VersionsListQuery:
      type: object
      additionalProperties: false
      required: [filter]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter:
          type: object
          additionalProperties: false
          required: [documentId]
          properties:
            documentId: { $ref: '#/components/schemas/Ulid' }
            author: { $ref: '#/components/schemas/StrOrList' }
            via: { type: string, enum: [human, agent, service] }
            createdAt: { $ref: '#/components/schemas/DateRange' }
            kind: { type: string, enum: [create, update, restore] }
            protected: { type: boolean, description: 'Permanent protection (protected column).' }
        sort: { type: array, items: { type: string, enum: [version, -version] } }
        page: { $ref: '#/components/schemas/Page' }
    SearchQuery:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        query: { type: string, minLength: 2, maxLength: 1000, description: 'websearch_to_tsquery syntax: quoted phrases, OR and -word to exclude.' }
        mode: { type: string, enum: [text, semantic, hybrid], default: text, description: 'In v1 only text. semantic and hybrid are reserved and answer semantic_search_not_configured.' }
        filter: { $ref: '#/components/schemas/DocumentsFilter' }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ChangesQuery:
      type: object
      additionalProperties: false
      required: [sinceSeq]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        sinceSeq: { type: integer, minimum: 0, description: 'Last applied seq. 0 = from the start of the retention and never answers invalid_cursor; a value older than the retention (30 days) does.' }
        limit: { type: integer, minimum: 1, maximum: 500, default: 200 }
        filter:
          type: object
          additionalProperties: false
          properties:
            pathPrefix: { type: string }
    SuggestRelationsQuery:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        id: { $ref: '#/components/schemas/Ulid' }
    TopicsListQuery:
      type: object
      additionalProperties: false
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter: { type: object, additionalProperties: false, properties: { prefix: { type: string } } }
        page: { $ref: '#/components/schemas/Page' }
    AttachmentsListQuery:
      type: object
      additionalProperties: false
      required: [filter]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter:
          type: object
          additionalProperties: false
          required: [documentId]
          properties: { documentId: { $ref: '#/components/schemas/Ulid' } }

    # ---------- resources ----------
    Relations:
      type: object
      additionalProperties: false
      properties:
        clients: { type: array, items: { type: integer } }
        projects: { type: array, items: { type: integer } }
        requirements: { type: array, items: { type: integer } }
        tasks: { type: array, items: { type: integer } }
    Lock:
      type: [object, 'null']
      additionalProperties: false
      properties:
        sessionId: { $ref: '#/components/schemas/Ulid' }
        holder: { type: string }
        holderName: { type: [string, 'null'], description: 'Name of whoever holds the lock (1.3.0).' }
        via: { type: string, enum: [human, agent] }
        expiresAt: { type: string, format: date-time }
    Folder:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        path: { type: string, description: 'Starts and ends with /: "/" is the root, "/clients/acme/" a subfolder.' }
        parentId: { type: [string, 'null'] }
        inheritAcl: { type: boolean, deprecated: true }
        externalBlocked: { type: boolean, deprecated: true, description: Obsolete (1.3.0), no effect. }
        sharingBlocked: { type: boolean, deprecated: true, description: Obsolete (1.3.0), no effect. Effective value (includes inheritance). }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        effectivePermission: { type: [string, 'null'], enum: [read, write, manage, null] }
        acl:
          type: array
          items:
            type: object
            properties:
              principalType: { type: string, enum: [role, user] }
              principal: { type: string }
              permission: { type: string, enum: [read, write, manage] }
    Document:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        title: { type: string }
        path: { type: string }
        folderId: { $ref: '#/components/schemas/Ulid' }
        fileName: { type: string }
        version: { type: integer }
        checksum: { type: string }
        sizeBytes: { type: integer }
        visibility: { type: string, enum: [internal, public, restricted] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdByName: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedByName: { type: [string, 'null'] }
        deletedAt: { type: [string, 'null'], format: date-time }
        clients: { type: array, items: { type: integer }, description: 'Ids of jiku.clients (empty for an external person).' }
        projects: { type: array, items: { type: integer }, description: 'Ids of jiku.projects (for an external person, only theirs).' }
        projectMatch: { type: string, enum: [direct, indirect], description: 'Only with filter.projectId.' }
        prunedVersionsCount: { type: integer, minimum: 0, description: 'Only documents.get, base field (never to an external person): how many versions the history compaction deleted.' }
        content: { type: string, description: 'Only with include content and size <= 256 KiB.' }
        contentUrl: { type: string, format: uri, description: 'Instead of content if it exceeds 256 KiB. Expires after 300 s.' }
        relations: { $ref: '#/components/schemas/Relations' }
        topics: { type: array, items: { type: string } }
        lock: { $ref: '#/components/schemas/Lock' }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
    Version:
      type: object
      properties:
        version: { type: integer }
        checksum: { type: string }
        sizeBytes: { type: integer }
        author: { type: string }
        authorName: { type: [string, 'null'] }
        via: { type: string, enum: [human, agent, service] }
        sessionId: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [create, update, restore], description: 'Origin of the version. Moving a document does not create a version.' }
        protected: { type: boolean, description: 'Permanent protection: creation, restore, with message or via service. The compaction never deletes it. The current version and those pinned by an active pinned share link are not deleted either, even if it is false.' }
    SearchHit:
      type: object
      properties:
        documentId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer }
        title: { type: string }
        path: { type: string }
        headingPath: { type: array, items: { type: string } }
        snippet: { type: string, maxLength: 500 }
        score: { type: number }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedByName: { type: [string, 'null'] }
        createdBy: { type: string }
        createdByName: { type: [string, 'null'] }
        visibility: { type: string, enum: [internal, public, restricted] }
        clients: { type: array, items: { type: integer } }
        projects: { type: array, items: { type: integer } }
        projectMatch: { type: string, enum: [direct, indirect] }
    Change:
      type: object
      properties:
        seq: { type: integer }
        type: { type: string, description: 'Event type (document.updated, document.moved, ...).' }
        documentId: { $ref: '#/components/schemas/Ulid' }
        version: { type: [integer, 'null'] }
        path: { type: string, description: Path of the document at the time of the event. }
        checksum: { type: [string, 'null'], description: 'Checksum of the version of the event (sha256:<hex>), so that a synced client compares without requesting the document.' }
        occurredAt: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        documentId: { $ref: '#/components/schemas/Ulid' }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        link: { type: string, format: uri, description: '{JIKU_WEB_URL}/docs/attachments/{id} (D-5).' }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }

    # ---------- share links ----------
    SharesListQuery:
      type: object
      additionalProperties: false
      required: [filter]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        filter:
          type: object
          additionalProperties: false
          required: [documentId]
          properties:
            documentId: { $ref: '#/components/schemas/Ulid' }
            status: { type: string, enum: [active, revoked, expired] }
            createdBy: { $ref: '#/components/schemas/StrOrList' }
        sort: { type: array, items: { type: string, enum: [createdAt, -createdAt, expiresAt, -expiresAt] } }
        page: { $ref: '#/components/schemas/Page' }
    ShareResolveQuery:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 200, description: 'Format jds_ + 43 base64url characters. A malformed token answers share_not_found, like any invalid share link.' }
        client: { $ref: '#/components/schemas/ClientInfo' }
    ShareAttachmentQuery:
      type: object
      additionalProperties: false
      required: [token, attachmentId]
      properties:
        token: { type: string, maxLength: 200 }
        attachmentId: { $ref: '#/components/schemas/Ulid' }
        client: { $ref: '#/components/schemas/ClientInfo' }
    Share:
      type: object
      description: Never includes the token or its hash.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        documentId: { $ref: '#/components/schemas/Ulid' }
        mode: { type: string, enum: [latest, pinned] }
        version: { type: [integer, 'null'] }
        includeAttachments: { type: boolean }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked, expired] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }
        revokeReason: { type: [string, 'null'], enum: [manual, document_deleted, restricted, null] }
        accessCount: { type: integer }
        lastAccessAt: { type: [string, 'null'], format: date-time }

    # ---------- replies ----------
    PageInfo:
      type: object
      properties:
        limit: { type: integer }
        returned: { type: integer }
        cursor: { type: string, description: 'Its absence is the only end signal.' }
        total: { type: integer, description: 'Only with count: true or "only".' }
    Failure:
      type: object
      required: [status, errorCode, errorMessage]
      properties:
        status: { const: failure }
        errorCode: { type: string, examples: [invalid_fields, invalid_cursor, document_not_found, version_pruned, folder_not_found, share_not_found, permission_denied, query_timeout, unknown_caller, caller_not_authorized, upstream_unavailable, internal_error] }
        errorMessage: { type: string }
        errorDetails: { type: object }
    ReplyAny:
      oneOf:
        - { type: object, required: [status, data], properties: { status: { const: success }, data: { type: object } } }
        - $ref: '#/components/schemas/Failure'
    ReplyFolderPage:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Folder' } }, page: { $ref: '#/components/schemas/PageInfo' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyFolder:
      oneOf:
        - { type: object, required: [status, data], properties: { status: { const: success }, data: { $ref: '#/components/schemas/Folder' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyDocumentPage:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Document' } }, page: { $ref: '#/components/schemas/PageInfo' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyDocument:
      oneOf:
        - { type: object, required: [status, data], properties: { status: { const: success }, data: { $ref: '#/components/schemas/Document' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyVersionPage:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Version' } }, page: { $ref: '#/components/schemas/PageInfo' } } }
        - $ref: '#/components/schemas/Failure'
    ReplySearch:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } } } }
        - $ref: '#/components/schemas/Failure'
    ReplyChanges:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [items, nextSeq, hasMore]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/Change' } }
                nextSeq: { type: integer, description: 'Last examined seq (even if its change was not visible to the caller); equal to sinceSeq if there was nothing new. Never less than sinceSeq: it is the sinceSeq of the next request.' }
                hasMore: { type: boolean }
        - $ref: '#/components/schemas/Failure'
    ReplySuggestRelations:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [projectId, clientId, score, reason]
                    properties:
                      projectId: { type: [integer, 'null'], description: 'null in a client-only candidate; never 0.' }
                      clientId: { type: [integer, 'null'] }
                      score: { type: number, minimum: 0, maximum: 1 }
                      reason: { type: string, description: 'For example "The title mentions “Videoconferencia”".' }
        - $ref: '#/components/schemas/Failure'
    ReplyTopics:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              properties:
                items: { type: array, items: { type: object, properties: { topic: { type: string }, documents: { type: integer } } } }
                page: { $ref: '#/components/schemas/PageInfo' }
        - $ref: '#/components/schemas/Failure'
    ReplyAttachments:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Attachment' } } } }
        - $ref: '#/components/schemas/Failure'
    ReplyShares:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Share' } }, page: { $ref: '#/components/schemas/PageInfo' } } }
        - $ref: '#/components/schemas/Failure'
    ReplyShareResolve:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [shareId, documentId, title, version]
              properties:
                shareId: { $ref: '#/components/schemas/Ulid' }
                documentId: { $ref: '#/components/schemas/Ulid' }
                title: { type: string }
                version: { type: integer }
                html: { type: string, description: 'Sanitized body, without frontmatter, with links to attachments rewritten to /p/docs/{token}/attachments/{id}. Up to 256 KiB.' }
                htmlUrl: { type: string, format: uri, description: 'Instead of html if it exceeds 256 KiB. Expires after 300 s.' }
                attachments:
                  type: array
                  description: Empty if the share link does not include attachments.
                  items:
                    type: object
                    properties:
                      id: { $ref: '#/components/schemas/Ulid' }
                      fileName: { type: string }
                      mimeType: { type: string }
        - $ref: '#/components/schemas/Failure'
    ReplyShareAttachment:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { const: success }
            data:
              type: object
              required: [downloadUrl, expiresIn]
              properties:
                downloadUrl: { type: string, format: uri }
                expiresIn: { type: integer }
        - $ref: '#/components/schemas/Failure'
