name: Dev images

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: dev-images
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: gravadigital

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - run: go test -race -count=1 ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=0.0.0-dev.${{ github.sha }}
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/jiku-docs:dev
            ${{ env.REGISTRY_NAMESPACE }}/jiku-docs:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=jiku-docs
            org.opencontainers.image.vendor=Grava Digital
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jiku-docs
          cache-to: type=gha,mode=max,scope=jiku-docs

  summary:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [[ "${{ needs.publish.result }}" != "success" ]]; then
            echo "::error::The dev image failed to publish."
            exit 1
          fi
          echo "Published dev and dev-${GITHUB_SHA} for jiku-docs."
