asyncapi: 3.0.0
info:
  title: Jiku — module registry
  version: 1.0.0
  description: |
    Minimal mechanism for Jiku to discover optional modules (the first is `docs`, served by jiku-docs).
    It belongs to the Jiku repository (docs/apis/), not to each module's.

    JetStream KV bucket `JIKU_MODULES` (underlying stream `KV_JIKU_MODULES`). The base Jiku deployment
    creates it idempotently, even when there are no modules. History: 1 per key. No TTL.

    Rules:
    - Each module writes its own key once at startup, when it is ready to serve.
    - A normal shutdown does not delete the key. Uninstalling is explicit (e.g. `jiku-docs module deregister`).
    - Convention: a module with `serviceName: X` serves the NATS micro services `X-commands` and `X-queries`.
    - The api computes the status:
        not_installed  the key does not exist
        incompatible   `protocol` differs from the one the api supports (treated as not_installed + error log)
        unavailable    key present, `$SRV.PING.{serviceName}-queries` without a reply
        available      key present, ping with a reply
    - New fields within v1 are optional and do not break compatibility: readers must tolerate them.
    - `serviceName` only names the micro services (and therefore the command and query subjects
      `{instance}.{userId}.{serviceName}-commands.v1.>` / `-queries.v1.>`). The event and notification
      subjects of each module are fixed and defined by its own contract (for docs:
      `{instance}.docs-events.v1.>` and `{instance}.{userId}.docs-notify.v1.>`).

    Auth-callout permissions to READ and WATCH the registry (api, connectors, people), verified
    by jiku-go:
      sub/pub  $JS.API.STREAM.INFO.KV_JIKU_MODULES
      pub      $JS.API.DIRECT.GET.KV_JIKU_MODULES.$KV.JIKU_MODULES.>
      pub      $JS.API.CONSUMER.CREATE.KV_JIKU_MODULES and $JS.API.CONSUMER.CREATE.KV_JIKU_MODULES.>
      pub      $JS.FC.KV_JIKU_MODULES.>   (flow control of the watch's ephemeral consumer)
      pub      $SRV.PING.{serviceName}-queries   (module status)
    plus its own inbox for the replies. To WRITE (only the module, only its key): pub
    `$KV.JIKU_MODULES.docs` and `$JS.API.STREAM.INFO.KV_JIKU_MODULES` (the client looks up the bucket
    before writing).
defaultContentType: application/json

servers:
  jiku-nats:
    host: '{natsHost}'
    protocol: nats
    variables:
      natsHost:
        default: nats.jiku.local:4222

channels:
  moduleRecord:
    address: '$KV.JIKU_MODULES.{module}'
    description: |
      Write of a module's key (KV put). Read through
      `$JS.API.DIRECT.GET.KV_JIKU_MODULES.$KV.JIKU_MODULES.{module}` or watched with an ephemeral
      consumer on `KV_JIKU_MODULES` (watch). Deleting the key means uninstallation.
    parameters:
      module:
        description: Short name of the module, lowercase.
        enum: [docs]
    messages:
      moduleRecord: { $ref: '#/components/messages/ModuleRecord' }

operations:
  registerModule:
    action: send
    channel: { $ref: '#/channels/moduleRecord' }
    description: The module writes its key at startup. Role `docs`, only the `docs` key.
  watchModules:
    action: receive
    channel: { $ref: '#/channels/moduleRecord' }
    description: api, connectors and people read and watch the registry.

components:
  messages:
    ModuleRecord:
      payload: { $ref: '#/components/schemas/ModuleRecord' }
      examples:
        - name: docs
          payload:
            module: docs
            serviceName: jiku-docs
            protocol: v1
            registeredAt: '2026-10-24T12:00:00.000Z'

  schemas:
    ModuleRecord:
      type: object
      required: [module, serviceName, protocol, registeredAt]
      properties:
        module: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$', description: Equal to the KV key. }
        serviceName: { type: string, pattern: '^[a-z][a-z0-9-]{1,40}$', description: 'Prefix of the micro services {serviceName}-commands and {serviceName}-queries (and of their subjects). It does not affect the event or notification subjects.' }
        protocol: { type: string, pattern: '^v[0-9]+$', description: Version of the module's contracts. }
        registeredAt: { type: string, format: date-time, description: Informational. }

    ModulesHttpResponse:
      description: Response of `GET /modules` in the Jiku api (HTTP, authenticated). Reference for the frontends.
      type: array
      items:
        type: object
        required: [module, status]
        properties:
          module: { type: string }
          status: { type: string, enum: [not_installed, unavailable, available] }
