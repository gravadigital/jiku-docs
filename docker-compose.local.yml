# jiku-docs next to Jiku's local stack (D-7).
#
# Requirements: Jiku's stack running (jiku/deploy/local.sh up), which creates the
# `jiku-local_jiku` network, NATS with the auth-callout, MinIO and the JIKU_MODULES KV. This compose
# touches nothing of Jiku: it adds its own Postgres, an init that creates the content bucket in
# Jiku's MinIO, and the service.
#
#   cp .env.dist .env   # fill in the machine user key and DOCS_SECRET_KEY
#   docker compose -f docker-compose.local.yml up -d --build
#
# Host ports (without clashing with Jiku: 5432, 4222, 9000, 3000-3100):
#   5442 -> jiku-docs Postgres, 8090 -> /healthz, /readyz, /metrics

name: jiku-docs-local

services:
  docs-database:
    image: postgres:16-alpine
    container_name: jiku-docs-local-database
    environment:
      - POSTGRES_DB=jiku_docs
      - POSTGRES_USER=jiku_docs
      - POSTGRES_PASSWORD=${DOCS_DATABASE_PASSWORD:?set DOCS_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - jiku-docs-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiku_docs -d jiku_docs"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - jiku

  # Creates (idempotently) the jiku-docs-content bucket in Jiku's MinIO, without versioning (it
  # suspends it if it was enabled), with the lifecycle rules for uploads/ and trash/.
  docs-storage-init:
    build:
      context: .
      args:
        VERSION: local
    image: gravadigital/jiku-docs:local
    container_name: jiku-docs-local-storage-init
    command: ["storage", "init"]
    env_file: .env
    restart: "no"
    networks:
      - jiku

  jiku-docs:
    image: gravadigital/jiku-docs:local
    container_name: jiku-docs-local
    # Runs with the host uid: Jiku's sentinel creds are 0600, owned by the user who generated them.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://jiku_docs:${DOCS_DATABASE_PASSWORD}@docs-database:5432/jiku_docs?sslmode=disable
      - NATS_URL=nats://nats:4222
      - NATS_CREDS=/run/secrets/nats.creds
    volumes:
      - ${JIKU_DEPLOY_DIR:-../../jiku/deploy}/nats/creds/sentinel-client.creds:/run/secrets/nats.creds:ro
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      docs-database:
        condition: service_healthy
      docs-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - jiku

volumes:
  jiku-docs-local-db:

networks:
  jiku:
    external: true
    name: jiku-local_jiku
